version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/audiobooks:/app/audiobooks
      - ./backend/src:/app/src
      - ./backend/jobs.db:/app/jobs.db
    environment:
      - DEVICE=cpu # Change to cuda if GPU available
      - COQUI_TOS_AGREED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
